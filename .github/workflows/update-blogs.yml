name: Update blog list

on:
  push:
    paths:
      - 'public/blog-*.html'
      - '.github/workflows/update-blogs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build public/blogs.json
        run: |
          node <<'EOF'
          const fs = require('fs'), cp = require('child_process');
          const dir = 'public';
          const dec = s => s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
          const out = [];
          for (const f of fs.readdirSync(dir)) {
            if (!/^blog-.+\.html$/.test(f)) continue;
            const s = fs.readFileSync(dir + '/' + f, 'utf8');
            const t = (s.match(/<title>([\s\S]*?)<\/title>/i) || [])[1] || f;
            const title = dec(t.replace(/\s*\|\s*Apni Dukan\s*$/i, '').trim());
            let d = (s.match(/<meta\s+name=["']date["']\s+content=["'](\d{4}-\d{2}-\d{2})["']/i) || [])[1];
            if (!d) {
              try { d = cp.execSync('git log --diff-filter=A --format=%as -- ' + dir + '/' + f).toString().trim().split('\n').pop(); } catch (e) {}
            }
            if (!d) d = new Date().toISOString().slice(0, 10);
            out.push({ url: '/' + f, title: title, date: d });
          }
          out.sort((a, b) => b.date.localeCompare(a.date) || a.url.localeCompare(b.url));
          fs.writeFileSync(dir + '/blogs.json', JSON.stringify(out, null, 1) + '\n');
          EOF
      - name: Commit if changed
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add public/blogs.json
          git diff --cached --quiet || (git commit -m "Update blog list" && git push)
